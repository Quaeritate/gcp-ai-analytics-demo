name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install recorded dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install application locally
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Run offline tests
        run: python -m pytest -q
      - name: Reproduce the synthetic report
        run: python -m gcp_ai_analytics demo-local --output examples/synthetic
      - name: Validate evaluation corpus without inference
        run: python -m gcp_ai_analytics evaluate-ai --output artifacts/local/ci-corpus
