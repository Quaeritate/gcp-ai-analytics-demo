[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-ai-analytics-demo"
version = "0.1.0"
description = "Server and application operations insights with BigQuery and Gemini"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Matej Bicej" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-cloud-bigquery>=3.46,<4",
    "google-genai>=2.32,<3",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gcp_ai_analytics = ["sql/*.sql", "evaluation_cases.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not cloud'"
markers = ["cloud: requires explicit cloud authorization, credentials, and potentially billed usage"]
